<svg width="200" height="150" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="150" fill="#f5f5f5"/>

  <!-- 中心节点 -->
  <rect x="75" y="65" width="50" height="20" rx="3" fill="#2D3748"/>
  <text x="100" y="78" text-anchor="middle" fill="white" font-size="10" font-family="Arial">KMIND</text>

  <!-- 左侧分支 -->
  <line x1="75" y1="75" x2="40" y2="40" stroke="#2D3748" stroke-width="1.5"/>
  <rect x="15" y="30" width="40" height="15" rx="2" fill="#E2E8F0" stroke="#2D3748"/>

  <line x1="75" y1="75" x2="40" y2="110" stroke="#2D3748" stroke-width="1.5"/>
  <rect x="15" y="102" width="40" height="15" rx="2" fill="#E2E8F0" stroke="#2D3748"/>

  <!-- 右侧分支 -->
  <line x1="125" y1="75" x2="160" y2="40" stroke="#2D3748" stroke-width="1.5"/>
  <rect x="145" y="30" width="40" height="15" rx="2" fill="#E2E8F0" stroke="#2D3748"/>

  <line x1="125" y1="75" x2="160" y2="110" stroke="#2D3748" stroke-width="1.5"/>
  <rect x="145" y="102" width="40" height="15" rx="2" fill="#E2E8F0" stroke="#2D3748"/>

  <!-- 调色板图标 -->
  <g transform="translate(90, 120)">
    <circle cx="5" cy="5" r="4" fill="#4A5568" opacity="0.7"/>
    <circle cx="10" cy="5" r="4" fill="#718096" opacity="0.7"/>
    <circle cx="7.5" cy="9" r="4" fill="#2D3748" opacity="0.7"/>
  </g>
</svg>
